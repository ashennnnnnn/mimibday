<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Mimi — A Map of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#1b1730;
    --night-mid:#332a5c;
    --gold:#e8c874;
    --blush:#f0a3c0;
    --parchment:#f8efdc;
    --ink:#3a2b1e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background:var(--night-deep);
    color:var(--parchment);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  /* ---------- INTRO ---------- */
  #intro-overlay{
    position:fixed; inset:0; z-index:300;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
    background:linear-gradient(180deg,#120e22 0%, var(--night-deep) 60%, #241c47 100%);
    transition:opacity .7s ease, visibility .7s ease;
  }
  #intro-overlay.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  #intro-card{
    max-width:440px; text-align:center; background:var(--parchment); color:var(--ink);
    border-radius:16px; padding:2.5rem 2rem; box-shadow:0 30px 70px rgba(0,0,0,0.5);
  }
  #intro-card h1{
    font-family:'Caveat',cursive; font-size:3rem; margin:0 0 .6rem; line-height:1.1;
  }
  #intro-card p{font-family:'Lora',serif; font-size:1.05rem; line-height:1.6; margin:0 0 1.8rem; opacity:.85;}
  #start-btn{
    font-size:1rem; font-weight:600; letter-spacing:.02em;
    background:var(--ink); color:var(--parchment);
    border:none; padding:.85rem 2.1rem; border-radius:40px; cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  #start-btn:hover{transform:translateY(-2px); background:#2a1d10;}
  #start-btn:active{transform:translateY(0);}

  /* ---------- SKY / MAP ---------- */
  #map-wrapper{
    position:fixed; inset:0; overflow:hidden;
    background:
      radial-gradient(circle at 22% 20%, rgba(240,163,192,0.10), transparent 45%),
      radial-gradient(circle at 78% 75%, rgba(232,200,116,0.08), transparent 50%),
      linear-gradient(180deg,#120e22 0%, var(--night-deep) 55%, #241c47 100%);
  }
  #starfield{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
  .star-dust{position:absolute; background:#fff; border-radius:50%; animation:twinkle ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.12;} 50%{opacity:.95;}}

  #map{
    position:absolute; top:50%; left:50%;
    width:2500px; height:1700px;
    transform:translate(-50%,-50%);
    transition:transform .5s ease-out;
  }
  .moon{
    position:absolute; width:110px; height:110px; border-radius:50%;
    background:var(--parchment);
    box-shadow:26px -10px 0 0 var(--night-deep), 0 0 50px rgba(248,239,220,.35);
  }
  .nebula{position:absolute; border-radius:50%; filter:blur(70px); opacity:.35;}

  /* ---------- CONSTELLATION TRAIL ---------- */
  #trail{
    filter:drop-shadow(0 0 4px rgba(232,200,116,.7));
    animation:dash 50s linear infinite;
  }
  @keyframes dash{ to{stroke-dashoffset:-1200;} }

  /* ---------- STARS (pins) ---------- */
  .star{
    position:absolute; transform:translate(-50%,-100%);
    text-align:center; cursor:pointer; user-select:none;
  }
  .star-glyph{
    font-size:2.4rem; line-height:1; color:var(--gold); display:inline-block;
    filter:drop-shadow(0 0 6px rgba(232,200,116,.65));
    animation:bob 3s ease-in-out infinite;
    transition:transform .2s ease;
  }
  .star:hover .star-glyph, .star:focus-visible .star-glyph{transform:scale(1.25) rotate(8deg);}
  @keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);}}
  .star-label{
    margin-top:2px; font-family:'Caveat',cursive; font-size:1.2rem; font-weight:700;
    background:rgba(248,239,220,0.95); color:var(--ink); padding:2px 12px;
    border-radius:20px; white-space:nowrap; box-shadow:0 3px 8px rgba(0,0,0,.25);
  }
  .star-final .star-glyph{font-size:3.1rem;}
  .star-final .star-label{background:var(--gold); font-size:1.4rem;}

  /* ---------- MODAL ---------- */
  #modal-overlay{
    position:fixed; inset:0; z-index:400;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
    background:rgba(15,11,30,0.7);
    opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s ease;
  }
  #modal-overlay.open{opacity:1; visibility:visible;}
  #modal-card{
    background:var(--parchment); color:var(--ink); border-radius:18px;
    max-width:440px; width:100%; padding:1.9rem; position:relative; text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,.45);
    transform:scale(.85); transition:transform .3s ease;
  }
  #modal-overlay.open #modal-card{transform:scale(1);}
  #modal-close{
    position:absolute; top:8px; right:12px; background:none; border:none;
    font-size:1.7rem; cursor:pointer; color:var(--ink); line-height:1; opacity:.6;
  }
  #modal-close:hover{opacity:1;}
  .photo-frame{
    border:2px dashed var(--gold); border-radius:12px; padding:1.6rem 1rem;
    margin-bottom:1.1rem; display:flex; flex-direction:column; align-items:center; gap:.3rem;
  }
  .photo-frame span{font-size:2.2rem; color:var(--gold);}
  .photo-frame small{font-family:'Lora',serif; font-style:italic; opacity:.6;}
  #modal-photo img{width:100%; border-radius:12px; margin-bottom:1.1rem; display:block;}
  #modal-heading{font-family:'Caveat',cursive; font-size:2.3rem; margin:.1rem 0 .7rem;}
  #modal-message{font-family:'Lora',serif; font-size:1.12rem; line-height:1.6; margin:0;}

  /* ---------- CONFETTI ---------- */
  .confetti-piece{position:fixed; top:-40px; z-index:500; pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:.15;}}

  @media (max-width:600px){
    #intro-card h1{font-size:2.4rem;}
    #intro-card p{font-size:.95rem;}
    .star-glyph{font-size:2rem;}
    .star-final .star-glyph{font-size:2.5rem;}
    #modal-heading{font-size:1.9rem;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<div id="intro-overlay">
  <div id="intro-card">
    <h1>Happy Birthday, Mimi ✦</h1>
    <p>This is our little sky. Move your mouse — or drag your finger — to look around, and tap each star for a memory.</p>
    <button id="start-btn">start exploring →</button>
  </div>
</div>

<div id="map-wrapper">
  <div id="starfield"></div>
  <div id="map">
    <svg id="path-svg" width="2500" height="1700" style="position:absolute;top:0;left:0;pointer-events:none;">
      <polyline id="trail" fill="none" stroke="#e8c874" stroke-width="2.5" stroke-dasharray="2 14" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal-card">
    <button id="modal-close" aria-label="Close">×</button>
    <div id="modal-photo"></div>
    <h2 id="modal-heading"></h2>
    <p id="modal-message"></p>
  </div>
</div>

<script>

const memories = [
  { x: 420,  y: 340,  heading: "How We Met",
    message: "Imagine finding the love of your life, in a comment section of a stupid sage reel :) that's us. I don't know how insane that fate was, but it is." },
  { x: 950,  y: 640,  heading: "Perfection",
    message: "That's who you are. You're jut so perfectly amazing, I don't have to worry about anything with you. It's like, the whole life I'll spend my time with you and I'll love every second of it." },
  { x: 1520, y: 380,  heading: "Our activities",
    message: "Watching your silly shows, playing games- me building things while you just stare at me in Minecraft :P I love being with you. I love making you smile and be happy." },
  { x: 2040, y: 800,  heading: "Silly Us",
    message: "Imagine calling each other Mimi and Zazu. We're cringe, but we love each other so it's fine :P" },
  { x: 1260, y: 1180, heading: "Why I Love You",
    message: "Its like you make my life so easy. I love how perfectly you take care of me, and I'd love to make sure I keep you happy all the time. That's my life goal, Just to keep you happy all your life." },
  { x: 1880, y: 1400, heading: "Happy Birthday, Mimi 🎂",
    message: "My love. You go through alot, and you're the strongest person I know. I'm right here, as your wall, as your support, and I love you so much.",
    final: true },
];

const mapEl = document.getElementById('map');
const trail = document.getElementById('trail');
const starfield = document.getElementById('starfield');
const modal = document.getElementById('modal-overlay');
const modalHeading = document.getElementById('modal-heading');
const modalMessage = document.getElementById('modal-message');
const modalPhoto = document.getElementById('modal-photo');

/* twinkling background starfield */
for(let i = 0; i < 90; i++){
  const s = document.createElement('div');
  s.className = 'star-dust';
  const size = (Math.random() * 2 + 1).toFixed(1);
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.left = (Math.random() * 100) + '%';
  s.style.top = (Math.random() * 100) + '%';
  s.style.animationDuration = (2 + Math.random() * 3) + 's';
  s.style.animationDelay = (Math.random() * 3) + 's';
  starfield.appendChild(s);
}

/* decorative moon + nebula clouds */
const decor = [
  { cls:'moon', style:'left:1900px; top:120px;' },
  { cls:'nebula', style:'left:150px; top:900px; width:600px; height:600px; background:#f0a3c0;' },
  { cls:'nebula', style:'left:1500px; top:1050px; width:700px; height:500px; background:#7a6bd4;' },
  { cls:'nebula', style:'left:700px; top:200px; width:500px; height:400px; background:#e8c874;' },
];
decor.forEach(d => {
  const el = document.createElement('div');
  el.className = d.cls;
  el.setAttribute('style', d.style);
  mapEl.appendChild(el);
});

/* constellation trail, generated from memories[] */
trail.setAttribute('points', memories.map(m => `${m.x},${m.y - 26}`).join(' '));

/* stars (pins), generated from memories[] */
memories.forEach(m => {
  const star = document.createElement('div');
  star.className = 'star' + (m.final ? ' star-final' : '');
  star.style.left = m.x + 'px';
  star.style.top = m.y + 'px';
  star.tabIndex = 0;
  star.setAttribute('role', 'button');
  star.setAttribute('aria-label', m.heading);
  star.innerHTML = `<div class="star-glyph">${m.final ? '🎂' : '✦'}</div><div class="star-label">${m.heading}</div>`;
  star.addEventListener('click', () => openModal(m));
  star.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(m); } });
  mapEl.appendChild(star);
});

function openModal(m){
  modalHeading.textContent = m.heading;
  modalMessage.textContent = m.message;
  modalPhoto.innerHTML = m.img
    ? `<img src="${m.img}" alt="">`
    : `<div class="photo-frame"><span>✦</span><small>add a photo here</small></div>`;
  modal.classList.add('open');
  if(m.final) burstHearts();
}
function closeModal(){ modal.classList.remove('open'); }
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* mouse / touch parallax across the sky */
function pan(clientX, clientY){
  const x = (clientX / window.innerWidth) - 0.5;
  const y = (clientY / window.innerHeight) - 0.5;
  mapEl.style.transform = `translate(calc(-50% + ${x * -170}px), calc(-50% + ${y * -120}px))`;
}
window.addEventListener('mousemove', e => pan(e.clientX, e.clientY));
window.addEventListener('touchmove', e => { const t = e.touches[0]; if(t) pan(t.clientX, t.clientY); }, {passive:true});

/* intro */
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('intro-overlay').classList.add('hidden');
});

/* confetti for the final star */
function burstHearts(){
  const pieces = ['💛','✨','🎉','💫','🎈'];
  for(let i = 0; i < 26; i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = pieces[Math.floor(Math.random() * pieces.length)];
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.fontSize = (16 + Math.random() * 18) + 'px';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }
}
</script>
</body>
</html>
